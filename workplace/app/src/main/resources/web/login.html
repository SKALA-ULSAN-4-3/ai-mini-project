<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="container">
  <h1>로그인</h1>

  <form id="loginForm">
    <label>사업자등록번호
      <input type="text" name="business_registration_number" required inputmode="numeric" autocomplete="username" placeholder="123-45-67890">
    </label>
    <label>비밀번호
      <input type="password" name="password" required minlength="8" maxlength="100" autocomplete="current-password">
    </label>
    <button type="submit">로그인</button>
  </form>

  <p id="msg" class="error-message" aria-live="polite"></p>
  <p>아직 회원이 아니신가요? <a href="/signup">회원가입</a></p>
</div>

<script>
  const form = document.getElementById("loginForm");
  const message = document.getElementById("msg");

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    message.textContent = "";

    const values = new FormData(form);
    const request = {
      business_registration_number: values.get("business_registration_number"),
      password: values.get("password")
    };

    try {
      const response = await fetch("/api/login", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(request)
      });
      const data = await response.json();

      if (!response.ok) {
        message.textContent = data.message || "로그인에 실패했습니다.";
        return;
      }

      // 개발 확인용 화면이므로 탭을 닫으면 사라지는 저장소를 사용합니다.
      // 실제 프론트엔드는 팀에서 정한 토큰 보관 정책을 따라야 합니다.
      sessionStorage.setItem("access_token", data.access_token);
      sessionStorage.setItem("token_type", data.token_type);
      window.location.href = "http://localhost:8008/index.html";
    } catch (error) {
      console.error(error);
      message.textContent = "서버에 연결할 수 없습니다.";
    }
  });
</script>
</body>
</html>
